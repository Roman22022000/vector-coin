
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>Emoji Match — Telegram Game</title>

<style>
:root {
    --bg: #17212b;
    --panel: #202e3a;
    --tile: #263746;
    --text: #f5f7fa;
    --muted: #91a2b1;
    --blue: #3390ec;
    --green: #35d49a;
    --red: #ff596a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

button, textarea { font: inherit; }
button { color: inherit; }

.app {
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 40%, #2b4559 0%, transparent 65%),
        var(--bg);
}

.workspace {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    padding: calc(58px + var(--safe-top)) 14px
             calc(140px + var(--safe-bottom));
    scrollbar-width: thin;
}

.top-actions {
    position: fixed;
    z-index: 30;
    top: calc(8px + var(--safe-top));
    right: 12px;
}

.icon-button {
    width: 43px;
    height: 43px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 50%;
    background: #263946;
    cursor: pointer;
    font-size: 23px;
}

.game-header {
    text-align: center;
    margin: 0 auto;
}

.game-header h1 {
    margin: 0 0 8px;
    font-size: 23px;
}

.game-header p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
}

.stats {
    width: min(100%, 420px);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 18px auto 15px;
}

.stat {
    padding: 10px 4px;
    border: 1px solid #344b5b;
    border-radius: 12px;
    background: #1b2b38eF;
    text-align: center;
}

.stat-value {
    display: block;
    margin-bottom: 4px;
    font-size: 20px;
    font-weight: 700;
}

.stat-label {
    display: block;
    color: var(--muted);
    font-size: 11px;
}

/* Игровое поле */
.board {
    width: min(100%, 420px);
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(7px, 2.2vw, 12px);
    margin: 0 auto;
    perspective: 1100px;
}

.card {
    position: relative;
    min-width: 0;
    aspect-ratio: 1;
    padding: 0;
    border: 0;
    border-radius: 13px;
    background: transparent;
    cursor: pointer;
    transform: translateZ(0);
    transition: transform .2s ease;
    -webkit-user-select: none;
    user-select: none;
}

.card:active:not(:disabled) {
    transform: scale(.96);
}

.card-inner {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    transform-style: preserve-3d;
    transition: transform .38s cubic-bezier(.2,.75,.25,1.15);
}

.card.flipped .card-inner,
.card.matched .card-inner {
    transform: rotateY(180deg);
}

.card-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: inherit;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

/* Исходный вид закрытой карточки */
.card-back {
    border: 1px solid #405b6e;
    background:
        linear-gradient(145deg, #30495b 0%, #263b4b 48%, #1e303e 100%);
    box-shadow:
        inset 0 1px 0 #ffffff13,
        inset 0 -3px 0 #00000016,
        0 3px 7px #00000018;
    color: #82a8c1;
    font-size: clamp(25px, 7vw, 36px);
    font-weight: 300;
}

.card-back::after {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid #ffffff08;
    border-radius: 9px;
    pointer-events: none;
}

.card-front {
    transform: rotateY(180deg);
    border: 2px solid #405b6b;
    background:
        radial-gradient(circle at 50% 35%, #425e70, #2a4050 72%);
    box-shadow:
        inset 0 1px 0 #ffffff13,
        0 3px 8px #00000022;
}

.card-front img.emoji {
    width: 65%;
    height: 65%;
    max-width: 68px;
    max-height: 68px;
    object-fit: contain;
    image-rendering: auto;
    filter: drop-shadow(0 3px 3px #0004);
}

/* Подсветка ошибочной пары */
.card.wrong .card-front {
    border-color: var(--red);
    background:
        radial-gradient(circle, #743744 0%, #4b2935 100%);
    box-shadow:
        0 0 7px #ff596a55,
        0 0 20px #ff596a44,
        inset 0 0 13px #ff596a25;
    animation: wrongPulse .32s ease-in-out 2;
}

@keyframes wrongPulse {
    0%, 100% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(.95); }
}

/* Совпавшая пара: зелёный свет и подпрыгивание */
.card.matched {
    z-index: 2;
    animation: matchJump .62s cubic-bezier(.2,.8,.25,1.35);
}

.card.matched .card-front {
    border-color: var(--green);
    background:
        radial-gradient(circle at 50% 35%, #247c63, #164638 78%);
    box-shadow:
        0 0 8px #35d49a88,
        0 0 20px #35d49a44,
        inset 0 0 13px #35d49a2a;
    animation: matchGlow 1.5s ease-in-out infinite alternate;
}

.card.matched .card-front img.emoji {
    filter: drop-shadow(0 0 5px #8bffd2aa);
}

@keyframes matchJump {
    0%   { transform: translateY(0) scale(1); }
    23%  { transform: translateY(-13px) scale(1.09); }
    48%  { transform: translateY(0) scale(.98); }
    70%  { transform: translateY(-5px) scale(1.03); }
    100% { transform: translateY(0) scale(1); }
}

@keyframes matchGlow {
    from {
        box-shadow:
            0 0 6px #35d49a55,
            0 0 12px #35d49a22,
            inset 0 0 8px #35d49a15;
    }
    to {
        box-shadow:
            0 0 12px #35d49aaa,
            0 0 25px #35d49a55,
            inset 0 0 16px #35d49a35;
    }
}

.card:disabled { cursor: default; }

.game-actions {
    display: flex;
    justify-content: center;
    gap: 9px;
    width: min(100%, 420px);
    margin: 18px auto 0;
}

.action-button {
    min-height: 42px;
    padding: 0 15px;
    border: 0;
    border-radius: 10px;
    background: var(--blue);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.action-button.secondary {
    border: 1px solid #3b5060;
    background: #263946;
}

.result-message {
    min-height: 22px;
    margin: 12px auto;
    color: var(--green);
    text-align: center;
    font-size: 13px;
}

/* Нижняя панель поверх игрового поля */
.composer-area {
    position: fixed;
    z-index: 40;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px 10px calc(9px + var(--safe-bottom));
    background: linear-gradient(to bottom, transparent, #17212be8 28%, #17212b 55%);
}

.composer {
    display: flex;
    align-items: flex-end;
    gap: 5px;
    width: min(100%, 720px);
    min-height: 52px;
    margin: 0 auto;
    padding: 5px;
    border: 1px solid #344957;
    border-radius: 18px;
    background: var(--panel);
}

.composer-button {
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    font-size: 22px;
}

.composer-button:hover { background: #30424f; }

#messageInput {
    flex: 1;
    min-width: 0;
    min-height: 40px;
    max-height: 110px;
    padding: 10px 5px;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    line-height: 20px;
}

#messageInput::placeholder { color: #8b9daa; }

.send-button {
    background: var(--blue);
    color: white;
}

/* Горизонтальная панель команд */
.extension-panel {
    position: absolute;
    z-index: 50;
    right: 10px;
    bottom: calc(70px + var(--safe-bottom));
    left: 10px;
    width: min(calc(100% - 20px), 700px);
    margin: 0 auto;
    padding: 10px;
    border: 1px solid #354b5a;
    border-radius: 15px;
    background: #1d2c38f7;
    box-shadow: 0 10px 36px #0006;
    backdrop-filter: blur(14px);
}

.extension-panel[hidden],
.control-panel[hidden],
.dropdown[hidden],
.modal-backdrop[hidden] { display: none; }

.panel-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 9px;
    color: #c5d2dc;
    font-size: 12px;
}

.close-panel {
    width: 29px;
    height: 29px;
    border: 0;
    border-radius: 50%;
    background: #30434f;
    cursor: pointer;
}

.extension-list {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 1px 1px 5px;
    scrollbar-width: thin;
}

.extension {
    flex: 0 0 88px;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 5px;
    border: 1px solid #344a59;
    border-radius: 12px;
    background: #263946;
    cursor: pointer;
    font-size: 11px;
}

.extension-icon { font-size: 28px; line-height: 1; }

/* Вспомогательные меню */
.control-panel {
    position: absolute;
    z-index: 51;
    bottom: calc(70px + var(--safe-bottom));
    left: 10px;
    width: min(275px, calc(100vw - 20px));
    padding: 8px;
    border: 1px solid #354b5a;
    border-radius: 15px;
    background: #1d2c38f7;
    box-shadow: 0 10px 36px #0006;
}

.control-item, .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 44px;
    padding: 10px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
}

.control-item:hover, .menu-item:hover { background: #30434f; }
.control-icon, .menu-icon { width: 28px; text-align: center; font-size: 22px; }

.dropdown {
    position: fixed;
    z-index: 70;
    top: calc(57px + var(--safe-top));
    right: 12px;
    width: 235px;
    padding: 7px;
    border: 1px solid #354b5a;
    border-radius: 14px;
    background: #202e3bf7;
    box-shadow: 0 12px 35px #0006;
    backdrop-filter: blur(14px);
}

.modal-backdrop {
    position: fixed;
    z-index: 100;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #081019b8;
    backdrop-filter: blur(4px);
}

.modal {
    width: min(100%, 410px);
    max-height: 80dvh;
    overflow-y: auto;
    padding: 21px;
    border: 1px solid #394f5e;
    border-radius: 17px;
    background: #1e2c38;
}

.modal h2 { margin: 0 0 12px; font-size: 20px; }
.modal p { color: #bdcbd5; font-size: 14px; line-height: 1.6; }

.modal-close {
    float: right;
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    background: #314451;
    cursor: pointer;
}

.modal .action-button { width: 100%; margin-top: 10px; }

@media (max-height: 650px) {
    .workspace { padding-top: calc(50px + var(--safe-top)); }
    .game-header h1 { font-size: 20px; }
    .stats { margin: 10px auto; }
    .stat { padding: 7px 4px; }
    .card { border-radius: 9px; }
}
</style>
</head>

<body>
<div class="app">

    <main class="workspace">
        <header class="game-header">
            <h1>Найди одинаковые</h1>
            <p>Переворачивай карточки и находи пары.<br>
            Совпадения подсвечиваются и подпрыгивают.</p>
        </header>

        <section class="stats">
            <div class="stat">
                <span class="stat-value" id="attempts">0</span>
                <span class="stat-label">🎯 Попытки</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="pairsFound">0/8</span>

        <button class="menu-item" data-action="shortcut"><span class="menu-icon">📲</span>Создать ярлык</button>
        <button class="menu-item" data-action="about"><span class="menu-icon">ℹ️</span>Об игре</button>
        <button class="menu-item" data-action="ratings"><span class="menu-icon">🏆</span>Рейтинги</button>

            <button class="composer-button send-button" id="sendButton" title="Отправить">➤</button>

            <button class="extension" data-command="/card"><span class="extension-icon">🃏</span>Создать карточку</button>
            <button class="extension" data-command="/requests"><span class="extension-icon">📨</span>Заявки</button>
            <button class="extension" data-command="/ads"><span class="extension-icon">📢</span>Реклама</button>

<!-- Twemoji: преобразует стандартные эмодзи в изображения -->
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js"></script>

<script>
"use strict";

/*
 * Twemoji загружается из CDN.
 * Для офлайн-работы библиотеку и изображения нужно скачать локально.
 * Это библиотека эмодзи, а не официальный набор Telegram Premium.
 */

const SYMBOLS = ["🍎", "🚀", "🌙", "🎮", "🐱", "💎", "🌈", "⭐"];

const board = document.getElementById("board");
const attemptsElement = document.getElementById("attempts");
const pairsFoundElement = document.getElementById("pairsFound");
const timerElement = document.getElementById("timer");
const resultMessage = document.getElementById("resultMessage");

let cards = [];
let firstCard = null;
let secondCard = null;
let isLocked = false;
let attempts = 0;
let pairsFound = 0;
let startedAt = null;
let timerInterval = null;
let mismatchTimeout = null;
let gameFinished = false;

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function createCards() {
    return shuffleArray(SYMBOLS.flatMap((symbol, pairId) => [
        { id: pairId * 2, value: symbol, flipped: false, matched: false, wrong: false },
        { id: pairId * 2 + 1, value: symbol, flipped: false, matched: false, wrong: false }
    ]));
}

function renderEmojis(element) {
    if (window.twemoji) {
        twemoji.parse(element, {
            folder: "svg",
            ext: ".svg",
            className: "emoji"
        });
    }
}

function renderBoard() {
    board.innerHTML = "";

    cards.forEach((card, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "card";

        if (card.flipped) button.classList.add("flipped");
        if (card.matched) button.classList.add("matched");
        if (card.wrong) button.classList.add("wrong");

        button.setAttribute("aria-label",
            card.flipped || card.matched
                ? "Карточка " + card.value
                : "Закрытая карточка");

        const inner = document.createElement("span");
        inner.className = "card-inner";

        const back = document.createElement("span");
        back.className = "card-face card-back";
        back.textContent = "?";

        const front = document.createElement("span");
        front.className = "card-face card-front";
        front.textContent = card.value;

        inner.append(back, front);
        button.appendChild(inner);

        // Конвертируем эмодзи в графические изображения.
        renderEmojis(front);

        button.disabled = card.matched || isLocked || card.flipped;
        button.addEventListener("click", () => flipCard(index));

        board.appendChild(button);
    });
}

function startTimer() {
    if (startedAt !== null) return;

    startedAt = Date.now();
    timerInterval = setInterval(() => {
        const seconds = Math.floor((Date.now() - startedAt) / 1000);
        timerElement.textContent =
            String(Math.floor(seconds / 60)).padStart(2, "0") + ":" +
            String(seconds % 60).padStart(2, "0");
    }, 250);
}

function flipCard(index) {
    const card = cards[index];

    if (isLocked || gameFinished || card.flipped || card.matched) return;

    startTimer();

    card.flipped = true;
    card.wrong = false;

    if (firstCard === null) {
        firstCard = card;
        renderBoard();
        return;
    }

    secondCard = card;
    attempts++;
    attemptsElement.textContent = String(attempts);

    if (firstCard.value === secondCard.value) {
        firstCard.matched = true;
        secondCard.matched = true;

        pairsFound++;
        pairsFoundElement.textContent = pairsFound + "/" + SYMBOLS.length;

        firstCard = null;
        secondCard = null;

        renderBoard();

        if (pairsFound === SYMBOLS.length) finishGame();
        return;
    }

    isLocked = true;
    firstCard.wrong = true;
    secondCard.wrong = true;
    renderBoard();

    mismatchTimeout = setTimeout(() => {
        if (firstCard) {
            firstCard.flipped = false;
            firstCard.wrong = false;
        }

        if (secondCard) {
            secondCard.flipped = false;
            secondCard.wrong = false;
        }

        firstCard = null;
        secondCard = null;
        isLocked = false;
        mismatchTimeout = null;

        renderBoard();
    }, 800);
}

function finishGame() {
    gameFinished = true;

    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    resultMessage.textContent =
        "🏆 Все пары найдены! Попыток: " + attempts +
        ". Время: " + timerElement.textContent;
    renderEmojis(resultMessage);
}

function startNewGame() {
    if (mismatchTimeout) clearTimeout(mismatchTimeout);
    if (timerInterval) clearInterval(timerInterval);

    mismatchTimeout = null;
    timerInterval = null;
    cards = createCards();
    firstCard = null;
    secondCard = null;
    isLocked = false;
    attempts = 0;
    pairsFound = 0;
    startedAt = null;
    gameFinished = false;

    attemptsElement.textContent = "0";
    pairsFoundElement.textContent = "0/8";
    timerElement.textContent = "00:00";
    resultMessage.textContent = "";

    renderBoard();
}

function reshuffleUnmatchedCards() {
    if (isLocked) return;

    const remaining = shuffleArray(cards.filter(card => !card.matched));
    let position = 0;

    cards = cards.map(card => card.matched ? card : remaining[position++]);
    firstCard = null;
    secondCard = null;
    renderBoard();
}

document.getElementById("restartButton").addEventListener("click", startNewGame);
document.getElementById("shuffleButton").addEventListener("click", reshuffleUnmatchedCards);

const input = document.getElementById("messageInput");
const extensionPanel = document.getElementById("extensionPanel");
const controlPanel = document.getElementById("controlPanel");
const topMenu = document.getElementById("topMenu");

function hideOverlayPanels(except = null) {
    if (except !== extensionPanel) extensionPanel.hidden = true;
    if (except !== controlPanel) controlPanel.hidden = true;
    if (except !== topMenu) topMenu.hidden = true;
}

function showExtensionPanel() {
    hideOverlayPanels(extensionPanel);
    extensionPanel.hidden = false;
}

function showControlPanel() {
    hideOverlayPanels(controlPanel);
    controlPanel.hidden = false;
}

function updateCommandPanel() {
    if (/(^|\s)\/[^\s]*$/.test(input.value)) {
        showExtensionPanel();
    } else {
        extensionPanel.hidden = true;
    }
}

input.addEventListener("input", () => {
    input.style.height = "40px";
    input.style.height = Math.min(input.scrollHeight, 110) + "px";
    updateCommandPanel();
});

document.getElementById("closeExtensionPanel").addEventListener("click", () => {
    extensionPanel.hidden = true;
});

document.getElementById("controlButton").addEventListener("click", () => {
    controlPanel.hidden ? showControlPanel() : (controlPanel.hidden = true);
});

document.getElementById("topMenuButton").addEventListener("click", () => {
    if (topMenu.hidden) {
        hideOverlayPanels(topMenu);
        topMenu.hidden = false;
    } else {
        topMenu.hidden = true;
    }
});

document.querySelectorAll("[data-command]").forEach(button => {
    button.addEventListener("click", () => {
        input.value = button.dataset.command + " ";
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        extensionPanel.hidden = false;
        controlPanel.hidden = true;
    });
});

const modalBackdrop = document.getElementById("modalBackdrop");
const modalTitle = document.getElementById("modalTitle");
const modalContent = document.getElementById("modalContent");

function openModal(title, html) {
    modalTitle.textContent = title;
    modalContent.innerHTML = html;
    modalBackdrop.hidden = false;
    hideOverlayPanels();
    renderEmojis(modalContent);
}

function closeModal() {
    modalBackdrop.hidden = true;
}

document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalOk").addEventListener("click", closeModal);

modalBackdrop.addEventListener("click", event => {
    if (event.target === modalBackdrop) closeModal();
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closeModal();
        hideOverlayPanels();
    }
});

function showAbout() {
    openModal("📖 Об игре", `
        <p>🃏 Открывай по две карточки за ход.</p>
        <p>❌ Ошибочная пара подсветится красным и закроется через 800 мс.</p>
        <p>✅ Совпавшие карточки засветятся зелёным и подпрыгнут.</p>
        <p>🔄 Не найденные карточки можно переворачивать повторно.</p>
    `);
}

document.querySelectorAll("[data-action]").forEach(button => {
    button.addEventListener("click", () => {
        const action = button.dataset.action;
        topMenu.hidden = true;

        if (action === "about") showAbout();

        if (action === "ratings") {
            openModal("🏆 Результат", `
                <p>🎯 Попытки: <b>${attempts}</b></p>
                <p>💎 Найдено пар: <b>${pairsFound}/8</b></p>
                <p>⏱️ Время: <b>${timerElement.textContent}</b></p>
                <p>Общий рейтинг игроков потребует сервера.</p>
            `);
        }

        if (action === "settings") {
            openModal("⚙️ Настройки", `
                <p>Графические эмодзи загружаются из библиотеки Twemoji.</p>
                <p>Для работы требуется интернет-соединение.</p>
            `);
        }

        if (action === "friends") {
            openModal("👥 Друзья", "<p>Для совместной игры и приглашений потребуется сервер.</p>");
        }

        if (action === "chats") {
            openModal("💬 Чаты", "<p>Поле ввода поддерживает локальные демонстрационные сообщения.</p>");
        }

        if (action === "shortcut") {
            openModal("📲 Создать ярлык", `
                <p>На компьютере открой меню браузера и выбери создание ярлыка или установку приложения, если доступно.</p>
                <p>На телефоне используй «Добавить на главный экран».</p>
            `);
        }
    });
});

document.querySelectorAll("[data-control]").forEach(button => {
    button.addEventListener("click", () => {
        const action = button.dataset.control;
        controlPanel.hidden = true;

        if (action === "restart") startNewGame();
        if (action === "shuffle") reshuffleUnmatchedCards();
        if (action === "extensions") showExtensionPanel();
        if (action === "about") showAbout();
    });
});

const sentMessages = [];

function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    if (message === "/game") {
        startNewGame();
    } else if (message === "/help") {
        showAbout();
    } else {
        sentMessages.push(message);
        // Сообщения хранятся в памяти текущей вкладки.
    }

    input.value = "";
    input.style.height = "40px";
    hideOverlayPanels();
}

document.getElementById("sendButton").addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

document.addEventListener("click", event => {
    const onTop = topMenu.contains(event.target) ||
        document.getElementById("topMenuButton").contains(event.target);

    const onControl = controlPanel.contains(event.target) ||
        document.getElementById("controlButton").contains(event.target);

    const onExtension = extensionPanel.contains(event.target);

    if (!onTop) topMenu.hidden = true;
    if (!onControl) controlPanel.hidden = true;

    if (!onExtension && !input.contains(event.target) &&
        !/(^|\s)\/[^\s]*$/.test(input.value)) {
        extensionPanel.hidden = true;
    }
});

startNewGame();
</script>
</body>
</html>
